name: CI - Build and Test (Windows)

on:
  pull_request:
    branches: [ master, main, dev ]
  push:
    branches: [ master, main, dev ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

env:
  WAILS_VERSION: v2.16.0

jobs:

  # 品質チェック・ビルドテスト統合ジョブ
  build-and-test:
    runs-on: windows-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod
        cache: true

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Go dependencies
      run: go mod download

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

    # --- Go品質チェック ---
    - name: Run go fmt
      shell: pwsh
      run: |
        $files = gofmt -s -l .
        if ($files) {
          Write-Host "以下のファイルがgo fmtでフォーマットされていません:"
          $files
          exit 1
        }

    - name: Run go mod tidy check
      shell: bash
      run: |
        go mod tidy
        if ! git diff --quiet go.mod go.sum; then
          echo "go mod tidyが必要です"
          git diff go.mod go.sum
          exit 1
        fi

    # --- ビルドテスト（インストーラーも作成できることを確認） ---
    - name: Install NSIS
      shell: pwsh
      run: |
        choco install nsis -y
        # choco does not update PATH for later steps; wails needs makensis
        "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH

    - name: Test Build (Windows Dev Mode)
      run: wails build -platform windows/amd64 -devtools -nsis

    # --- Go品質チェック / embed 指定があるためビルド後に実施する ---
    - name: Run go vet
      run: go vet .

    # Office (Excel/Word) is not installed on the runner, so Office tests are skipped
    - name: Run go test
      shell: bash
      run: CGO_ENABLED=1 go test -short -race -count=1 ./...

    # ビルドされたファイルが存在することを確認
    - name: Verify build artifacts
      shell: bash
      run: |
        echo "Build directory contents:"
        find build -type f 2>/dev/null || echo "Build directory not found"
        
        # exe ファイルとインストーラーが生成されていることを確認
        # (wails はインストーラーを作成できなくても警告のみで成功するため)
        test -f build/bin/pdf-preview-go.exe || (echo "No exe file found" && exit 1)
        find build/bin -name "*-installer.exe" | grep -q "." || (echo "No installer found" && exit 1)
        
        echo "✅ Windows用ビルドアーティファクトが正常に生成されました"
