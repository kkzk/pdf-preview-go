name: Build and Release (Windows)

# A release is created by pushing a version tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# Tags with a suffix (e.g. v0.3.0-beta.1) are published as pre-releases.
#
# Running the workflow manually (workflow_dispatch) is a dry run: it builds
# and passes the artifacts to the release job, but creates no release.
on:
  push:
    tags: [ 'v*.*.*' ]
  workflow_dispatch:

env:
  WAILS_VERSION: v2.16.0

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Set version from tag
      id: version
      shell: pwsh
      run: |
        if ("${{ github.event_name }}" -eq 'workflow_dispatch') {
          # Dry run: use the version in wails.json
          $current = (Get-Content wails.json -Raw | ConvertFrom-Json).Info.productVersion
          $tag = "v$current-dryrun"
        } else {
          $tag = "${{ github.ref_name }}"
        }
        if ($tag -notmatch '^v((\d+\.\d+\.\d+)(-[0-9A-Za-z.-]+)?)$') {
          Write-Error "Tag '$tag' is not a version tag like v1.2.3 or v1.2.3-beta.1"
          exit 1
        }
        $version = $Matches[1]      # e.g. 0.3.0-beta.1 (used in file names)
        $coreVersion = $Matches[2]  # e.g. 0.3.0
        "version=$version" >> $env:GITHUB_OUTPUT

        # Embed the version in the exe and the installer. Windows version
        # resources and NSIS accept only numbers, so the suffix is left out.
        $config = Get-Content wails.json -Raw | ConvertFrom-Json
        $config.Info.productVersion = $coreVersion
        $config | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8
        Write-Host "Version: $version (product version $coreVersion)"

    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod
        cache: true

    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Wails
      run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

    - name: Install frontend dependencies
      working-directory: frontend
      run: npm ci

    - name: Install NSIS
      shell: pwsh
      run: |
        choco install nsis -y
        # choco does not update PATH for later steps; wails needs makensis
        "${env:ProgramFiles(x86)}\NSIS" >> $env:GITHUB_PATH

    - name: Build Windows Application with Installer
      run: wails build -platform windows/amd64 -nsis

    - name: Prepare artifacts
      shell: bash
      run: |
        version="${{ steps.version.outputs.version }}"
        mkdir -p dist

        # wails only warns when the installer cannot be created, so check it here
        installer=$(find build/bin -name "*-installer.exe" | head -1)
        if [ -z "$installer" ]; then
          echo "Installer was not created"
          ls -la build/bin
          exit 1
        fi

        cp "$installer" "dist/pdf-preview-go-v${version}-amd64-installer.exe"
        cp build/bin/pdf-preview-go.exe "dist/pdf-preview-go-v${version}-amd64.exe"
        ls -la dist

    - name: Upload artifacts
      uses: actions/upload-artifact@v7
      with:
        name: pdf-preview-go-windows
        path: dist/*
        retention-days: 7

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download Windows artifacts
      uses: actions/download-artifact@v8
      with:
        name: pdf-preview-go-windows
        path: release-assets

    - name: List release assets
      run: ls -la release-assets

    - name: Create Release
      if: github.event_name == 'push'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref_name }}
        name: PDF Preview Go ${{ github.ref_name }}
        body: |
          ## PDF Preview Go ${{ github.ref_name }} - Windows版

          ### インストール方法
          1. `pdf-preview-go-${{ github.ref_name }}-amd64-installer.exe` をダウンロード（推奨）
          2. インストーラーを実行してセットアップ

          ### 単体実行の場合
          1. `pdf-preview-go-${{ github.ref_name }}-amd64.exe` をダウンロード
          2. 任意のフォルダに保存して直接実行

          ### システム要件
          - Windows 10 64-bit 以降
          - Microsoft Edge WebView2 ランタイム（Windows 11 には標準搭載。未導入の場合はインストーラーが導入します）
          - Microsoft Office（Excel / Word。Office ファイルを PDF に変換するために使用）
        files: release-assets/*
        draft: false
        prerelease: ${{ contains(github.ref_name, '-') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
